name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render site
        run: quarto render
      - name: Stamp build identity
        run: |
          SITE_COMMIT="${{ github.sha }}"
          SITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export SITE_COMMIT SITE_BUILD_TIME
          python3 - <<'PY'
          import os
          from pathlib import Path
          commit = os.environ["SITE_COMMIT"]
          build_time = os.environ["SITE_BUILD_TIME"]
          for path in Path("_site").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              text = text.replace("SITE_COMMIT_PLACEHOLDER", commit).replace("SITE_BUILD_TIME_PLACEHOLDER", build_time)
              path.write_text(text, encoding="utf-8")
      - name: Verify build identity
        env:
          SITE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          commit = os.environ["SITE_COMMIT"]
          text = "\n".join(path.read_text(encoding="utf-8") for path in Path("_site").rglob("*.html"))
          assert "SITE_COMMIT_PLACEHOLDER" not in text
          assert "SITE_BUILD_TIME_PLACEHOLDER" not in text
          assert commit in text
          assert re.search(r"build (?:<strong>)?20\d\d-\d\d-\d\dT\d\d:\d\d:\d\dZ(?:</strong>)?", text)
          print(f"Build identity verified for {commit}")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
